name: Bug report
description: Something in EmbodiInfer does not behave as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, credentials, addresses, private paths, or personal
        data. For a security problem, follow
        [SECURITY.md](https://github.com/BUAA-CI-LAB/EmbodiInfer/blob/main/SECURITY.md)
        instead of opening an issue.
  - type: input
    id: revision
    attributes:
      label: EmbodiInfer revision
      description: The release version, or the output of `git rev-parse HEAD`.
      placeholder: 0.0.1 or fa7654f
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - embodiinfer/policies (contracts and model adapters)
        - embodiinfer/models (nets by family)
        - embodiinfer/layers (operator contracts)
        - embodiinfer/backend (Torch/Triton kernels)
        - embodiinfer/engine (core, sessions, async, CUDA graph)
        - embodiinfer/engine/parallel or embodiinfer/engine/rollout
        - embodiinfer/engine/serve (HTTP/websocket frontends)
        - tests, benchmarks, or examples
        - install, dependency groups, or lock file
        - documentation
        - not sure
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The actual behaviour, including error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the documentation or the API contract says should happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The exact command, the dependency profile or group, the input shape or
        prompt with private data redacted, and the observed output. Say whether
        the run was repeatable.
      render: text
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - CPU only
        - Single CUDA GPU
        - Multiple CUDA GPUs
        - Other accelerator
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: weights
    attributes:
      label: Weights involved
      options:
        - No weights (unit test or synthetic input)
        - Public checkpoint
        - Private or internal checkpoint
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Operating system, Python version, uv version, dependency profile or
        group, Torch version, and GPU with driver and CUDA version.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted excerpts only. Attach full logs as a file if needed.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I redacted tokens, credentials, addresses, private paths, and personal data.
          required: true
        - label: This is not a security vulnerability, or I have already reported it privately.
          required: true
