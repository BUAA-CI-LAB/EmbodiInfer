<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title desc">
  <title id="title">EmbodiInfer inference architecture</title>
  <desc id="desc">Applications, RL trainers, and EmbodiRun use Python or serving interfaces. The engine manages batches, sessions, graphs, and replicas. Policy adapters own model-specific processing and decoding.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52667e"/></marker>
  </defs>
  <rect width="840" height="400" rx="18" fill="#f7f8fc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#182c45">
    <rect x="28" y="25" width="240" height="52" rx="10" fill="#fff" stroke="#ccd7e5"/>
    <rect x="300" y="25" width="240" height="52" rx="10" fill="#fff" stroke="#ccd7e5"/>
    <rect x="572" y="25" width="240" height="52" rx="10" fill="#fff" stroke="#ccd7e5"/>
    <text x="148" y="58" font-size="22" font-weight="700">Applications</text>
    <text x="420" y="58" font-size="22" font-weight="700">RL trainers</text>
    <text x="692" y="58" font-size="22" font-weight="700">EmbodiRun</text>
    <path d="M148 78V92M420 78V92M692 78V92" fill="none" stroke="#52667e" stroke-width="2"/>
    <path d="M148 123V140M420 123V140M692 123V140" fill="none" stroke="#52667e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="148" y="115" font-size="16" fill="#52667e">Python API</text>
    <text x="420" y="115" font-size="16" fill="#52667e">Rollout / refit</text>
    <text x="692" y="115" font-size="16" fill="#52667e">HTTP / WirelessComm</text>
    <rect x="28" y="142" width="784" height="91" rx="12" fill="#e8edff" stroke="#6275d3"/>
    <text x="420" y="179" font-size="25" font-weight="700">EmbodiInfer engine</text>
    <text x="420" y="212" font-size="19">Batching · recurrent sessions · CUDA graphs · multi-GPU execution</text>
    <path d="M420 234V264" fill="none" stroke="#52667e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="28" y="266" width="784" height="108" rx="12" fill="#fff" stroke="#ccd7e5"/>
    <text x="420" y="299" font-size="22" font-weight="700">Policy adapters</text>
    <text x="420" y="328" font-size="18">Checkpoint loading · preprocessing · model execution · action decoding</text>
    <text x="420" y="355" font-size="17" fill="#52667e">Manipulation policies | World-action models | Navigation policies</text>
  </g>
</svg>
